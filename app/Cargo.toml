[package]
name = "blockforge_app"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Android / desktop front-end for blockforge: winit window + wgpu renderer + touch controls"

[lib]
name = "blockforge_app"
crate-type = ["cdylib", "rlib"]

[dependencies]
blockforge = { path = ".." }
# wgpu is pinned to the 22.x API (request_adapter -> Option, entry_point: &str).
# Upgrading is a deliberate, separate step.
wgpu = "22.1"
winit = "0.30"
pollster = "0.3"
# Decodes the block textures in assets/textures (pure Rust).
png = "0.17"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }

[dev-dependencies]
# Used by tests/shader.rs to validate the WGSL on the host, before the slow APK build.
naga = { version = "22.1", features = ["wgsl-in"] }

# This crate is its own workspace root so the parent crate stays dependency-free.
[workspace]

[profile.dev]
# The APK is built in the dev profile (no signing keys needed), so optimise it:
# world generation and meshing are unusable at opt-level 0.
opt-level = 3
debug = false

# ---- cargo-apk packaging (NativeActivity) ----
[package.metadata.android]
package = "com.blockforge.alpha"
apk_name = "blockforge"
build_targets = ["aarch64-linux-android"]
# Launcher icon and colours (app/res). The drawing script is app/icon-src/make_icon.py.
resources = "res"

# Sign every debug APK with the same key (app/debug.keystore) so a new build installs over
# the previous one and keeps the saved world and settings. Without this, each CI runner made
# its own random key and Android refused the update. This is a debug key with the standard
# "android" password: it is not a secret, and must never sign a Play Store release.
[package.metadata.android.signing.dev]
path = "debug.keystore"
keystore_password = "android"

[package.metadata.android.sdk]
min_sdk_version = 26
# Play Protect warns ("built for an older version of Android") when this is more than two
# below the phone's Android API level. 35 is clean on Android 15, 16 and 17 (API 35-37).
target_sdk_version = 35

[package.metadata.android.application]
label = "Blockforge"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
orientation = "landscape"
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode|density"
