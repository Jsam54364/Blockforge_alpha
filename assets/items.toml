# Items: weapons, staves, armour and potions. They join the block registry after the
# blocks (as `model = "item"`), so they share ids, names, icons and saving with them; the
# numbers here are read by `rpg::items::ItemBook`. Each has a 32 x 32 sprite of the same
# name in assets/textures (painted by tools/paint_items.py), drawn in the hand as that
# sprite given one texel of thickness: 32 texels to the metre, like every block.
#
# Weapons: damage by kind (slash, blunt, pierce), reach (metres from the wielder's middle),
# arc (degrees swept), stamina per light swing (twice for a heavy one), poise (how hard it
# shakes), guard (share of a blow's physical damage a guard stops), bleed (seconds),
# hands = 2 for two-handed. Light swings chain into a combo of three.

[[item]]
name = "wooden_club"
label = "Wooden Club"
kind = "weapon"
class = "club"
blunt = 9
reach = 2.2
arc = 90
stamina = 11
poise = 12
guard = 0.45

