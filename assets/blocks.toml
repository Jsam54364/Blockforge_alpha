# Block definitions. Data-driven: the server sends this file to clients on join,
# so ids always match. The first entry MUST be "air" (id 0).
# Append only! Reordering changes numeric ids and breaks existing worlds.
#
# Fields (all optional except name):
#   solid=true  opaque=true  render="opaque"|"cutout"|"translucent"
#   light=0..15  hardness=1.0 (negative = unbreakable)
#   texture / top / side / bottom  (texture names, interned into ids)
#   behavior="name"  (must be registered in behavior.rs)

[[block]]
name = "air"
solid = false
opaque = false

[[block]]
name = "stone"
group = "natural"
family = "stone"
label = "Andesite"
hardness = 1.5

[[block]]
name = "dirt"
group = "natural"
family = "soil"
hardness = 0.5

[[block]]
name = "grass"
group = "natural"
family = "soil"
hardness = 0.6
top = "grass_top"
side = "grass_side"
bottom = "dirt"

[[block]]
name = "sand"
group = "natural"
family = "sand"
hardness = 0.5
behavior = "falling"

[[block]]
name = "water"
group = "natural"
family = "water"
solid = false
opaque = false
render = "translucent"
hardness = 100

[[block]]
name = "log"
group = "wood"
family = "oak"
label = "Oak Log"
hardness = 2.0
top = "log_top"
bottom = "log_top"
side = "log_side"

[[block]]
name = "leaves"
group = "wood"
family = "oak"
label = "Oak Leaves"
opaque = false
render = "cutout"
hardness = 0.2

[[block]]
name = "glowstone"
group = "minerals"
family = "crystal"
light = 15
hardness = 0.3

[[block]]
name = "bedrock"
group = "natural"
family = "stone"
hardness = -1

