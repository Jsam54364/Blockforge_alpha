name: Android APK

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: "28.2.13676358"

jobs:
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Type-check and test the app on the host
        shell: bash
        run: |
          if [ ! -f app/Cargo.toml ]; then echo "No app/ folder yet." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          set +e
          cargo test --manifest-path app/Cargo.toml --color never 2>&1 | tee check.log
          code=${PIPESTATUS[0]}
          {
            echo "### app host check: exit code $code"
            echo '```'
            if grep -q "could not compile" check.log; then head -n 150 check.log; else tail -n 60 check.log; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  apk:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;34.0.0 ndk;${{ env.NDK_VERSION }}"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Install cargo-apk
        run: command -v cargo-apk || cargo install cargo-apk
      - name: Build APK
        shell: bash
        working-directory: app
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          set +e
          cargo apk build --lib 2>&1 | tee ../apk.log
          code=${PIPESTATUS[0]}
          {
            echo "### cargo apk build: exit code $code"
            echo '```'
            if [ "$code" -ne 0 ]; then head -n 120 ../apk.log; else tail -n 15 ../apk.log; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Align, sign and check the APK
        shell: bash
        run: |
          # cargo-apk runs zipalign and then apksigner, but the apksigner it picks (the newest
          # build-tools on the runner) rewrites the file and drops the alignment. Android 11+
          # refuses to install an app whose resources.arsc is not 4-byte aligned ("package
          # appears to be invalid"), so align and sign again with known tools, then check.
          bt="$ANDROID_HOME/build-tools/34.0.0"
          apk=$(find app/target -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then echo "No APK produced" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          "$bt/zipalign" -f -p 4 "$apk" aligned.apk
          "$bt/apksigner" sign --alignment-preserved --ks app/debug.keystore --ks-pass pass:android \
            --out blockforge-debug.apk aligned.apk
          # Fail the build rather than publish an APK the phone will reject.
          if ! "$bt/zipalign" -c -p 4 blockforge-debug.apk; then
            echo "APK is not aligned; not publishing it" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          "$bt/apksigner" verify blockforge-debug.apk
          # Every build should show the same fingerprint (the key in app/debug.keystore).
          # If it changes, phones will refuse to update over the installed app.
          cert=$("$bt/apksigner" verify --print-certs blockforge-debug.apk | grep -m1 'SHA-256' || echo "could not read")
          echo "Aligned and verified. Signing certificate: $cert" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        shell: bash
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk blockforge-debug.apk \
            --prerelease --target "$BRANCH" \
            --title "Latest debug APK" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download blockforge-debug.apk and install it over the previous version (no uninstall needed; saved world and settings are kept)."
          echo "APK published: see the Releases page" >> "$GITHUB_STEP_SUMMARY"
